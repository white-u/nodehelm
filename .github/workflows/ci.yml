name: ci

on:
  workflow_dispatch:
  # release.yml publishes nothing until this has passed for the same commit.
  workflow_call:
  push:
    branches: [main]
    # Prose changes nothing a compiler or linter can check.
    paths-ignore: ["**.md", "LICENSE"]
  pull_request:
    paths-ignore: ["**.md", "LICENSE"]

# A new push supersedes any run still in progress for the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    # A hanging test would otherwise consume the six-hour default; a cold build
    # plus the suite takes a few minutes.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      # The default theme arrives as a published archive, verified against the
      # hash in web-theme.pin. Run here rather than left to build.rs so the
      # download happens on the runner: release builds go through cross, whose
      # container does not necessarily carry curl.
      - run: ./scripts/theme.sh

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web-admin/package-lock.json

      # rust-embed requires the panel's dist/ to exist before cargo runs.
      - run: npm ci && npm run lint && npm test && npm run build
        working-directory: web-admin

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: python3 -m unittest discover -s management/tests -v
      - run: cargo test

      # The agent ships inside the hub, so it is checked with it.
      - run: cargo fmt --check && cargo clippy --all-targets --locked -- -D warnings && cargo test --locked
        working-directory: agent

      # Both installers run as root on the user's machine. Notes below warning
      # level are all SC2015 on `[ a ] && [ b ] || die`, which is meant to die
      # when either test fails.
      - run: shellcheck -S warning install.sh install-hub.sh update-hub.sh nodehelm.sh scripts/*.sh

      # This commit's hub against this commit's agent: the field contract
      # between the two, and what the public view withholds.
      - run: cargo build
      - run: python3 management/tests/integration_http.py target/debug/monitor-hub
      - run: cargo build --release --locked
        working-directory: agent
      - run: scripts/e2e.sh target/debug/monitor-hub agent/target/release/monitor-agent
